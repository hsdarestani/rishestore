services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rishe
      POSTGRES_USER: rishe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rishe -d rishe"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rishe:${POSTGRES_PASSWORD}@db:5432/rishe?schema=public
      APP_SECRET: ${APP_SECRET}
      NEXT_PUBLIC_SITE_URL: https://new.rishe.store
      ZIBAL_MERCHANT: ${ZIBAL_MERCHANT}
      BALE_BOT_TOKEN: ${BALE_BOT_TOKEN:-}
      BALE_ADMIN_CHAT_ID: ${BALE_ADMIN_CHAT_ID:-}
      BALE_WEBHOOK_SECRET: ${BALE_WEBHOOK_SECRET:-}
    volumes:
      - uploads:/app/public/uploads
      - brand_assets:/app/public/brand

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  brand_assets:
  caddy_data:
  caddy_config:
