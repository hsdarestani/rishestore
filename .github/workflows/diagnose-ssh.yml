name: Diagnose Rishe SSH connectivity
on:
  push:
    branches: [update/basalam-only-storefront]
    paths: [".github/workflows/diagnose-ssh.yml"]
permissions:
  contents: read
jobs:
  check-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Check server connectivity without exposing secret host
        env:
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -uo pipefail
          if [ -z "${HOST:-}" ]; then echo "HOST secret missing"; exit 1; fi
          for port in 22 9011 2222 2200 2022 22222 22022 8022; do
            if timeout 3 bash -c 'exec 3<>/dev/tcp/"$1"/"$2"' _ "$HOST" "$port" 2>/dev/null; then
              echo "Port $port: OPEN"
            else
              echo "Port $port: CLOSED"
            fi
          done
          python3 - <<'PY'
          import os, socket, urllib.request
          host=os.environ['HOST']
          try:
              resolved={entry[4][0] for entry in socket.getaddrinfo(host,None)}
              dns={entry[4][0] for entry in socket.getaddrinfo('rishe.store',None)}
              print('Secret host DNS resolves:',bool(resolved))
              print('Secret host overlaps public rishe.store DNS:',bool(resolved & dns))
          except Exception as e:
              print('DNS check failed:',type(e).__name__)
          try:
              with urllib.request.urlopen('https://rishe.store/api/health',timeout=10) as response:
                  print('Public health response code:',response.status)
          except Exception as e:
              print('Public health fetch failed:',type(e).__name__)
          PY

      - name: Distinguish CDN frontend from origin and test alternate owned hostname
        env:
          HOST: ${{ secrets.HOST }}
        run: |
          python3 - <<'PY'
          import os,socket,ipaddress,urllib.request
          host=os.environ["HOST"]
          try:
              ipaddress.ip_address(host)
              print("Secret HOST is literal IP:", True)
          except ValueError:
              print("Secret HOST is literal IP:", False)
              print("Secret HOST is main domain:", host=="rishe.store")
          for name in ["rishe.store","www.rishe.store","new.rishe.store"]:
              try:
                  addresses={x[4][0] for x in socket.getaddrinfo(name,None)}
                  print(name,"DNS exists:", bool(addresses))
                  for port in [22,9011,2222,2200]:
                      try:
                          conn=socket.create_connection((name,port),timeout=1.5)
                          conn.close()
                          print(name,"SSH port",port,": OPEN")
                      except Exception:
                          pass
              except Exception as e:
                  print(name,"DNS failed:", type(e).__name__)
          try:
              response=urllib.request.urlopen("https://rishe.store/api/health",timeout=10)
              print("Public HTTP Server:",response.headers.get("Server","unknown"))
              print("Public CF-ray header present:",bool(response.headers.get("Cf-Ray")))
          except Exception as e:
              print("HTTP header check failed:",type(e).__name__)
          PY

      - name: Verify configured SSH credentials and inspect app runtime
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$PASS"
          sshpass -e ssh -p 9011 -o StrictHostKeyChecking=no -o ConnectTimeout=12 "${SSH_USER:-root}@$HOST" '
            echo "SSH login successful"
            echo "Application source directories:"
            for dir in /opt/rishestore /opt/rishe /srv/rishestore; do test ! -d "$dir" || echo "$dir"; done
            echo "Application containers:"
            docker ps --format "{{.Names}} :: {{.Status}} :: {{.Ports}}" | grep -Ei "rishe|postgres|caddy" || true
            echo "Nginx enabled sites:"
            ls /etc/nginx/sites-enabled 2>/dev/null || true
          '

      - name: Inspect exact running compose project without modifying services
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -p 9011 -o StrictHostKeyChecking=no -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          set -e
          echo '=== resources ==='
          free -m | head -3
          df -h / | tail -1
          echo '=== app compose metadata ==='
          docker inspect rishestore_pars-app-1 --format 'workdir={{index .Config.Labels "com.docker.compose.project.working_dir"}}'
          docker inspect rishestore_pars-app-1 --format 'config={{index .Config.Labels "com.docker.compose.project.config_files"}}'
          docker inspect rishestore_pars-app-1 --format 'image={{.Config.Image}}'
          echo '=== app source mounts (names only) ==='
          docker inspect rishestore_pars-app-1 --format '{{range .Mounts}}{{.Type}} => {{.Destination}}{{println}}{{end}}'
          echo '=== nginx domain routing ==='
          grep -E 'server_name|proxy_pass|listen ' /etc/nginx/sites-enabled/rishe.store || true
          echo '=== app source and git ==='
          dir="$(docker inspect rishestore_pars-app-1 --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}')"
          case "$dir" in /opt/*|/srv/*|/var/www/*) ;; *) echo 'Unexpected dir'; exit 2;; esac
          ls -la "$dir" | head -24
          if test -d "$dir/.git"; then
            echo "git SHA: $(git -C "$dir" rev-parse --short HEAD)"
            echo "git branch: $(git -C "$dir" branch --show-current)"
            git -C "$dir" remote -v | cut -d' ' -f1 | head -2
          fi
          echo '=== compose files ==='
          find "$dir" -maxdepth 1 \( -name 'compose*' -o -name 'docker-compose*' -o -name 'Dockerfile*' \) -printf '%f\n'
          REMOTE

      - name: Inspect existing deployment script and Compose structure
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -p 9011 -o StrictHostKeyChecking=no -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          set -e
          echo '=== deploy script commands (sensitive assignments redacted) ==='
          python3 - <<'PY'
          import re
          for n,line in enumerate(open('/opt/rishestore-pars/deploy.sh'),1):
              s=line.rstrip()
              if re.search(r'(?i)(password|api.key|api_token|secret|private.key|telegram_token|zibal_merchant|SMSIR_API)',s):
                  print(f'{n:03}: [sensitive line withheld]')
              else:
                  print(f'{n:03}: {s[:210]}')
          PY
          echo '=== compose structural lines ==='
          python3 - <<'PY'
          import re
          for n,line in enumerate(open('/opt/rishestore-pars/compose.yml'),1):
              s=line.rstrip()
              if re.search(r'(?i)(password|api.key|api_token|secret|private.key|telegram_token|zibal_merchant|SMSIR_API)',s):
                  print(f'{n:03}: [sensitive line withheld]')
              else:
                  print(f'{n:03}: {s[:190]}')
          PY
          echo '=== Docker images footprint ==='
          docker images --format '{{.Repository}} {{.Tag}} {{.Size}}' | grep -Ei 'rishe|postgres|node' | head -15
          echo '=== disk consumption ==='
          du -sh /opt/rishestore-pars /var/lib/docker 2>/dev/null || true
          REMOTE

      - name: Check disk budget and reusable Docker image space
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -p 9011 -o StrictHostKeyChecking=no -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          set -e
          echo '=== docker system df ==='
          docker system df
          echo '=== volumes ==='
          docker volume ls --format '{{.Name}}' | grep rishestore | head -15
          echo '=== disk top dirs ==='
          du -sh /var/cache/apt /var/log /var/lib/docker/overlay2 /opt /root/.cache /tmp 2>/dev/null || true
          echo '=== data backup size estimate ==='
          docker exec rishestore_pars-db-1 psql -U rishe -d rishe -Atc "SELECT pg_size_pretty(pg_database_size('rishe'));" || true
          REMOTE

      - name: Measure existing Next.js build and dependency versions
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -p 9011 -o StrictHostKeyChecking=no -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          set -e
          echo '=== existing node dependencies ==='
          docker exec rishestore_pars-app-1 node -e 'for (const s of ["next","react","@prisma/client","tsx"]) { try {console.log(s,require(s+"/package.json").version)} catch(e){console.log(s,"unknown")} }'
          echo '=== existing build sizes ==='
          docker exec rishestore_pars-app-1 du -sh /app/.next /app/app /app/components /app/lib /app/prisma /app/node_modules
          echo '=== existing image ==='
          docker image inspect rishe-pars:latest --format '{{.Id}} | {{.Size}}'
          REMOTE
