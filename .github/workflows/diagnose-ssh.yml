name: Diagnose Rishe SSH connectivity
on:
  push:
    branches: [update/basalam-only-storefront]
    paths: [".github/workflows/diagnose-ssh.yml"]
permissions:
  contents: read
jobs:
  check-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Check server connectivity without exposing secret host
        env:
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -uo pipefail
          if [ -z "${HOST:-}" ]; then echo "HOST secret missing"; exit 1; fi
          for port in 22 2222 2200 2022 22222 22022 8022; do
            if timeout 3 bash -c 'exec 3<>/dev/tcp/"$1"/"$2"' _ "$HOST" "$port" 2>/dev/null; then
              echo "Port $port: OPEN"
            else
              echo "Port $port: CLOSED"
            fi
          done
          python3 - <<'PY'
          import os, socket, urllib.request
          host=os.environ['HOST']
          try:
              resolved={entry[4][0] for entry in socket.getaddrinfo(host,None)}
              dns={entry[4][0] for entry in socket.getaddrinfo('rishe.store',None)}
              print('Secret host DNS resolves:',bool(resolved))
              print('Secret host overlaps public rishe.store DNS:',bool(resolved & dns))
          except Exception as e:
              print('DNS check failed:',type(e).__name__)
          try:
              with urllib.request.urlopen('https://rishe.store/api/health',timeout=10) as response:
                  print('Public health response code:',response.status)
          except Exception as e:
              print('Public health fetch failed:',type(e).__name__)
          PY
