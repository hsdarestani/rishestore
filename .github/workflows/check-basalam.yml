name: Verify Basalam storefront transition
on:
  pull_request:
    branches: [main]
  push:
    branches: [update/basalam-only-storefront]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
