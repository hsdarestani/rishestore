name: Deploy Rishe on Pars VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rishe-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated app and SSH connection
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$PASS"
          sshpass -e ssh -p 9011 -o StrictHostKeyChecking=no -o ConnectTimeout=15 "root@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          case " $(hostname -I) " in *" 143.20.60.195 "*) ;; *) echo "Wrong VPS"; exit 1;; esac
          test -f /opt/rishestore-pars/compose.yml
          docker ps --format '{{.Names}}' | grep -Fxq rishestore_pars-app-1
          docker ps --format '{{.Names}}' | grep -Fxq rishestore_pars-db-1
          curl -fsS --max-time 8 http://127.0.0.1:3108/api/health | grep -q '"ok":true'
          REMOTE
      - name: Build release using matching Alpine platform
        run: |
          set -euo pipefail
          docker build -t rishe-release:"$GITHUB_SHA" .
          cid="$(docker create rishe-release:"$GITHUB_SHA")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p payload/prisma
          for part in .next app components lib; do docker cp "$cid:/app/$part" "payload/$part"; done
          docker cp "$cid:/app/prisma/seed.ts" payload/prisma/seed.ts
          docker run --rm --entrypoint node rishe-release:"$GITHUB_SHA" -e '["next","react","@prisma/client","tsx"].forEach(p=>console.log(p+"="+require(p+"/package.json").version))' > payload/versions.txt
          tar -C payload -czf /tmp/rishe-update.tgz .
          du -h /tmp/rishe-update.tgz
      - name: Transfer small patch to isolated app directory
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          cat /tmp/rishe-update.tgz | sshpass -e ssh -p 9011 -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ConnectTimeout=15 "root@$HOST" "set -e; mkdir -p /opt/rishestore-pars/.updates/$GITHUB_SHA; tar -xz -C /opt/rishestore-pars/.updates/$GITHUB_SHA"
      - name: Back up and upgrade Rishe without touching Nginx or other services
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          sshpass -e ssh -p 9011 -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=60 -o ConnectTimeout=15 "root@$HOST" "RELEASE=$GITHUB_SHA bash -s" <<'REMOTE'
          set -Eeuo pipefail
          exec 9>/var/lock/pars-vds-bot-deploy.lock
          flock -w 1200 9
          case " $(hostname -I) " in *" 143.20.60.195 "*) ;; *) echo "Wrong server"; exit 1;; esac
          cd /opt/rishestore-pars
          stage="/opt/rishestore-pars/.updates/$RELEASE"
          test -f "$stage/.next/BUILD_ID"
          test -f "$stage/prisma/seed.ts"
          diff -u "$stage/versions.txt" <(docker exec rishestore_pars-app-1 node -e '["next","react","@prisma/client","tsx"].forEach(p=>console.log(p+"="+require(p+"/package.json").version))')
          free_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          test "$free_kb" -gt 850000 || { echo 'Insufficient disk'; exit 1; }
          umask 077
          mkdir -p releases
          docker exec rishestore_pars-db-1 pg_dump -U rishe -d rishe | gzip -1 > "releases/pre-update-$RELEASE.sql.gz"
          test -s "releases/pre-update-$RELEASE.sql.gz"
          rollback="rishe-pars:rollback-$(echo "$RELEASE" | cut -c1-12)"
          docker tag rishe-pars:latest "$rollback"
          cid="$(docker create rishe-pars:latest sh -c 'sleep 1800')"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker start "$cid" >/dev/null
          docker exec "$cid" sh -c 'rm -rf /app/.next /app/app /app/components /app/lib'
          for part in .next app components lib; do docker cp "$stage/$part" "$cid:/app/$part"; done
          docker cp "$stage/prisma/seed.ts" "$cid:/app/prisma/seed.ts"
          docker commit --change 'CMD ["sh","/app/docker-entrypoint.sh"]' "$cid" rishe-pars:basalam-release >/dev/null
          cleanup
          trap - EXIT
          rollback_release() {
            echo 'Health check failed: restoring previous Rishe image'
            docker tag "$rollback" rishe-pars:latest
            docker compose -f compose.yml -p rishestore_pars up -d --no-deps --force-recreate app worker || true
          }
          trap rollback_release ERR
          docker tag rishe-pars:basalam-release rishe-pars:latest
          docker compose -f compose.yml -p rishestore_pars up -d --no-deps --force-recreate app worker
          healthy=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:3108/api/health 2>/dev/null | grep -q '"ok":true'; then healthy=1; break; fi
            sleep 2
          done
          test "$healthy" -eq 1
          headers="$(curl -sS --max-time 15 -D - -o /dev/null http://127.0.0.1:3108/go/basalam)"
          echo "$headers" | grep -iq '^HTTP/.* 307'
          echo "$headers" | tr -d '\r' | grep -iq '^location: https://basalam.com/rishestore'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3108/api/orders)" = 410
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3108/why-rishe)" = 404
          nginx -t
          echo "$RELEASE" > releases/last-verified-sha
          rm -rf "$stage"
          trap - ERR
          echo "RISHE_PRODUCTION_RELEASE_VERIFIED"
          REMOTE
      - name: Verify public routes
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://rishe.store/api/health | grep -q '"ok":true'
          headers="$(curl -sS --max-time 20 -D - -o /dev/null https://rishe.store/go/basalam)"
          echo "$headers" | grep -iq '^HTTP/.* 307'
          echo "$headers" | tr -d '\r' | grep -iq '^location: https://basalam.com/rishestore'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://rishe.store/api/orders)" = 410
          echo "Public website Basalam redirect and checkout closure verified"
