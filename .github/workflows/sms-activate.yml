name: Configure Rishe SMS on production
on:
  push:
    branches: [ops/rishe-sms-preflight]
    paths: [.github/workflows/sms-activate.yml]
permissions: {}
concurrency:
  group: rishe-production
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SMS and verify the app
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
          SMSIR_API: ${{ secrets.SMSIR_API }}
        run: |
          set +x
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          [[ "$SMSIR_API" =~ ^[A-Za-z0-9_+/=.-]+$ ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          script=$(cat <<'REMOTE'
          set +x
          set -Eeuo pipefail
          umask 077
          case " $(hostname -I) " in *" 143.20.60.195 "*) ;; *) exit 1;; esac
          cd /opt/rishestore-pars
          exec 9>/var/lock/pars-vds-bot-deploy.lock
          flock -w 45 9
          c=(docker compose -f compose.yml -p rishestore_pars)
          test "$("${c[@]}" ps -q app)" = "$(docker inspect -f '{{.Id}}' rishestore_pars-app-1)"
          curl -fsS --max-time 5 http://127.0.0.1:3108/api/health | grep -q '"ok":true'
          IFS= read -r sms
          [[ "$sms" =~ ^[A-Za-z0-9_+/=.-]+$ ]]
          work=$(mktemp -d ./.sms-config.XXXXXX)
          trap 'rm -rf "$work"' EXIT
          test ! -L .env
          if test -f .env; then cp -p .env "$work/env"; fi
          cp -p compose.yml "$work/compose"
          changed=0
          recreated=0
          rollback() {
            if (( changed )); then
              cp -p "$work/compose" compose.yml
              if test -f "$work/env"; then cp -p "$work/env" .env; else rm -f .env; fi
              if (( recreated )); then "${c[@]}" up -d --no-deps --no-build --pull never --force-recreate app >/dev/null 2>&1 || true; fi
            fi
          }
          trap rollback ERR
          changed=1
          if test -f .env; then awk '!/^[[:space:]]*(export[[:space:]]+)?SMSIR_API[[:space:]]*=/' .env > "$work/new"; else : > "$work/new"; fi
          printf '\nSMSIR_API=%s\n' "$sms" >> "$work/new"
          mv "$work/new" .env
          unset sms SMSIR_API
          present() {
            "${c[@]}" config --format json 2>/dev/null | python3 -c 'import json,sys; sys.exit(not bool(json.load(sys.stdin)["services"]["app"].get("environment",{}).get("SMSIR_API")))'
          }
          if ! present; then
            echo 'App Compose file does not wire SMSIR_API; original settings restored.'
            false
          fi
          recreated=1
          "${c[@]}" up -d --no-deps --no-build --pull never --force-recreate app
          healthy=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:3108/api/health 2>/dev/null | grep -q '"ok":true'; then healthy=1; break; fi
            sleep 2
          done
          test "$healthy" -eq 1
          docker exec rishestore_pars-app-1 node -e 'process.exit(process.env.SMSIR_API?.trim() ? 0 : 1)'
          trap - ERR
          echo 'Rishe application is healthy and SMS configuration is loaded.'
          REMOTE
          )
          printf '%s\n' "$SMSIR_API" | sshpass -e ssh -p 9011 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "root@$HOST" "bash -c $(printf %q "$script")"
          curl -fsS --max-time 15 https://rishe.store/api/health | grep -q '"ok":true'
