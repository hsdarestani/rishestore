name: Check Rishe administrator accounts
on:
  push:
    branches: [ops/rishe-sms-preflight]
    paths: [.github/workflows/panel-account-check.yml]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read and encrypt administrator account identifiers
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq sshpass >/dev/null
          printf '%s' '' | base64 -d > "$RUNNER_TEMP/recipient.pem"
          sshpass -e ssh -p 9011 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "root@$HOST" 'docker exec -i rishestore_pars-db-1 psql -X -qAt -v ON_ERROR_STOP=1 -U rishe -d rishe' <<'SQL' | openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/recipient.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0
          BEGIN READ ONLY;
          SELECT 'count|' || role || '|' || count(*) FROM "User" GROUP BY role;
          SELECT 'phone|' || phone FROM "User" WHERE role = 'ADMIN' OR (role = 'STAFF' AND (permissions::jsonb ? 'admin.access' OR permissions::jsonb ? '*')) ORDER BY "createdAt" LIMIT 8;
          COMMIT;
          SQL
          printf '\n'
